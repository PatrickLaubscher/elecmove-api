# Désactiver l'import de env.properties
spring.config.import=

# Configuration H2 pour les tests (remplace MySQL)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Configuration mail (désactivée pour les tests)
spring.mail.host=localhost
spring.mail.username=test@test.com
spring.mail.password=test
spring.mail.port=25
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Jackson
spring.jackson.date-format=HH:mm
spring.jackson.time-zone=UTC

# Thymeleaf
spring.thymeleaf.encoding=UTF-8

# Profile de test
spring.profiles.active=test

# JWT - Clé de test (ne pas utiliser en production !)
jwt.key.location=classpath:test-jwt-key.pem