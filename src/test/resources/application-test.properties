# Désactiver l'import de env.properties
spring.config.import=

# Configuration H2 pour les tests (remplace MySQL)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Propriétés de base de données pour résoudre ${db.*}
db.url=jdbc:h2:mem:testdb
db.username=sa
db.password=

# Propriétés mail pour résoudre ${mail.*}
mail.host=localhost
mail.username=test@test.com
mail.password=test
mail.port=25
mail.protocol=smtp

# Configuration Spring Mail (utilise les propriétés ci-dessus)
spring.mail.host=${mail.host}
spring.mail.username=${mail.username}
spring.mail.password=${mail.password}
spring.mail.port=${mail.port}
spring.mail.protocol=${mail.protocol}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# JWT
jwt.key.location=classpath:test-jwt-key/

# Jackson
spring.jackson.date-format=HH:mm
spring.jackson.time-zone=UTC

# Thymeleaf
spring.thymeleaf.encoding=UTF-8

# Profile de test
spring.profiles.active=test