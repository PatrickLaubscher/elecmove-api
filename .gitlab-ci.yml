stages:
  - test
  - build
  - package
  - deploy

variables:
  SPRING_PROFILES_ACTIVE: test
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  ARTIFACT_NAME: "elecmove-api"

test_app:
  stage: test
  image: gradle:8.4-jdk21
  # Services Docker-in-Docker retirés - pas supportés par shared runners
  before_script:
    - export GRADLE_USER_HOME=`pwd`/.gradle
  script:
    - chmod +x gradlew
    - ./gradlew clean test --info --continue
  allow_failure: true
  timeout: 30 minutes
  artifacts:
    when: always
    reports:
      junit: build/test-results/test/TEST-*.xml
    paths:
      - build/reports/tests/test/
    expire_in: 1 day
  coverage: '/Total.*?([0-9]{1,3})%/'
  only:
    - /^feature\/.*$/
    - dev
    - main
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .gradle/wrapper
      - .gradle/caches

build_app:
  stage: build
  image: gradle:8.4-jdk21
  # Services Docker-in-Docker retirés
  before_script:
    - export GRADLE_USER_HOME=`pwd`/.gradle
  script:
    - chmod +x gradlew
    - ./gradlew clean build -x test --info
  artifacts:
    paths:
      - build/libs/*.jar
    expire_in: 1 day
  only:
    - /^feature\/.*$/
    - dev
    - main
  dependencies:
    - test_app
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .gradle/wrapper
      - .gradle/caches

package_jar:
  stage: package
  image: gradle:8.4-jdk21
  before_script:
    - export GRADLE_USER_HOME=`pwd`/.gradle
  script:
    - chmod +x gradlew
    - ./gradlew bootJar
    - ls -lh build/libs/
  artifacts:
    name: "${ARTIFACT_NAME}-${CI_COMMIT_SHORT_SHA}"
    paths:
      - build/libs/*.jar
    expire_in: 7 days
  only:
    - main
  dependencies:
    - build_app

deploy_production:
  stage: deploy
  image: ubuntu:22.04
  before_script:
    - apt-get update && apt-get install -y openssh-client curl
    - eval $(ssh-agent -s)
    - chmod 600 "$SSH_PRIVATE_KEY"
    - ssh-add "$SSH_PRIVATE_KEY"
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts
  script:
    - echo "Deploiement sur le serveur de production..."
    - echo "Contenu de build/libs :"
    - ls -lh build/libs/
    - ssh $SERVER_USER@$SERVER_HOST "mkdir -p /opt/elecmove/backend/backups"
    - ssh $SERVER_USER@$SERVER_HOST "if [ -f /opt/elecmove/backend/elecmove-api.jar ]; then sudo mv /opt/elecmove/backend/elecmove-api.jar /opt/elecmove/backend/backups/elecmove-api-\$(date +%Y%m%d-%H%M%S).jar; echo 'Backup cree'; fi"
    - export JAR_FILE=$(ls build/libs/*.jar | grep -v 'plain' | head -n 1)
    - echo "Fichier JAR a deployer $JAR_FILE"
    - ls -lh "$JAR_FILE"
    - scp "$JAR_FILE" $SERVER_USER@$SERVER_HOST:/home/debian/elecmove-api-new.jar
    - ssh