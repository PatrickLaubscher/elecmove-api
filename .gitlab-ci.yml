stages:
  - test
  - build
  - package
  - deploy

variables:
  SPRING_PROFILES_ACTIVE: test


test_app:
  stage: test
  image: gradle:8.4-jdk21
  services:
    - docker:24-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - chmod +x gradlew
    - ./gradlew clean test
  only:
    - /^feature\/.*$/

build_app:
  stage: build
  image: gradle:8.4-jdk21
  services:
    - docker:24-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - chmod +x gradlew
    - ./gradlew clean build -x test
    - /^feature\/.*$/
  only:
    - /^feature\/.*$/
  dependencies:
    - test_app