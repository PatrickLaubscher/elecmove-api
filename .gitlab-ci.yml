stages:
  - build
  - analyse
  - package
  - deploy

variables:
  SPRING_PROFILES_ACTIVE: test
  SONAR_TOKEN: $SONAR_TOKEN

build_app:
  stage: build
  image: gradle:8.4-jdk21
  services:
    - docker:24-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - chmod +x gradlew
    - ./gradlew clean test
  only:
    - /^feature\/.*$/

analyse_build:
  stage: analyse
  image: gradle:8.4-jdk21
  script:
    - chmod +x gradlew
    - ./gradlew sonarqube
  only:
    - /^feature\/.*$/
  dependencies:
    - build_app