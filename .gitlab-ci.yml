stages:
  - test
  - build
  - package
  - deploy

variables:
  SPRING_PROFILES_ACTIVE: test
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  ARTIFACT_NAME: "elecmove-api"

# ========================================
# STAGE: TEST
# ========================================
test_app:
  stage: test
  image: gradle:8.4-jdk21
  services:
    - docker:24-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - export GRADLE_USER_HOME=`pwd`/.gradle
  script:
    - chmod +x gradlew
    - ./gradlew clean test --info
  artifacts:
    when: always
    reports:
      junit: build/test-results/test/TEST-*.xml
    paths:
      - build/reports/tests/test/
    expire_in: 1 week
  coverage: '/Total.*?([0-9]{1,3})%/'
  only:
    - /^feature\/.*$/
    - dev
    - main
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .gradle/wrapper
      - .gradle/caches

# ========================================
# STAGE: BUILD
# ========================================
build_app:
  stage: build
  image: gradle:8.4-jdk21
  services:
    - docker:24-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - export GRADLE_USER_HOME=`pwd`/.gradle
  script:
    - chmod +x gradlew
    - ./gradlew clean build -x test --info
  artifacts:
    paths:
      - build/libs/*.jar
    expire_in: 1 week
  only:
    - /^feature\/.*$/
    - dev
    - main
  dependencies:
    - test_app
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .gradle/wrapper
      - .gradle/caches

# ========================================
# STAGE: PACKAGE (main uniquement)
# ========================================
package_jar:
  stage: package
  image: gradle:8.4-jdk21
  before_script:
    - export GRADLE_USER_HOME=`pwd`/.gradle
  script:
    - chmod +x gradlew
    - ./gradlew bootJar
    - ls -lh build/libs/
  artifacts:
    name: "${ARTIFACT_NAME}-${CI_COMMIT_SHORT_SHA}"
    paths:
      - build/libs/*.jar
    expire_in: 30 days
  only:
    - main
  dependencies:
    - build_app

# ========================================
# STAGE: DEPLOY PRODUCTION (main uniquement)
# ========================================
deploy_production:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client curl
    - eval $(ssh-agent -s)
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    # Sauvegarder la clé dans un fichier temporaire
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa    # ← Crée un fichier
    - chmod 600 ~/.ssh/id_rsa                     # ← Permissions correctes
    # Ajouter la clé à l'agent
    - ssh-add ~/.ssh/id_rsa                       # ← Charge depuis le fichier
    - ssh-keyscan -H $SERVER_HOST >> ~/.ssh/known_hosts
  script:
    - echo "Déploiement sur le serveur de production..."
    - ssh $SERVER_USER@$SERVER_HOST "mkdir -p /opt/elecmove/backend/backups"
    - |
      ssh $SERVER_USER@$SERVER_HOST "
        if [ -f /opt/elecmove/backend/elecmove-api.jar ]; then
          sudo mv /opt/elecmove/backend/elecmove-api.jar /opt/elecmove/backend/backups/elecmove-api-\$(date +%Y%m%d-%H%M%S).jar
          echo 'Backup créé'
        fi
      "
    - scp build/libs/*.jar $SERVER_USER@$SERVER_HOST:/tmp/elecmove-api-new.jar
    - ssh $SERVER_USER@$SERVER_HOST "sudo mv /tmp/elecmove-api-new.jar /opt/elecmove/backend/elecmove-api.jar"
    - ssh $SERVER_USER@$SERVER_HOST "sudo chown debian:debian /opt/elecmove/backend/elecmove-api.jar"
    - ssh $SERVER_USER@$SERVER_HOST "sudo systemctl restart elecmove-api"
    - echo "Attente du démarrage..."
    - sleep 15
    - |
      ssh $SERVER_USER@$SERVER_HOST "
        if curl -f http://localhost:8080/actuator/health > /dev/null 2>&1; then
          echo 'Application démarrée avec succès'
          sudo systemctl status elecmove-api --no-pager
        else
          echo 'Erreur: Application non accessible'
          echo 'Rollback en cours...'
          sudo systemctl stop elecmove-api
          sudo cp /opt/elecmove/backend/backups/\$(ls -t /opt/elecmove/backend/backups/ | head -1) /opt/elecmove/backend/elecmove-api.jar
          sudo systemctl start elecmove-api
          exit 1
        fi
      "
    - |
      ssh $SERVER_USER@$SERVER_HOST "
        cd /opt/elecmove/backend/backups
        ls -t | tail -n +6 | xargs -r rm --
        echo 'Anciens backups nettoyés'
      "
  environment:
    name: production
    url: http://$SERVER_HOST:8080
  only:
    - main
  dependencies:
    - package_jar
  when: manual

# ========================================
# STAGE: ROLLBACK (en cas de problème)
# ========================================
rollback_production:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H $SERVER_HOST >> ~/.ssh/known_hosts
  script:
    - echo "Rollback vers la version précédente..."
    - |
      ssh $SERVER_USER@$SERVER_HOST "
        sudo systemctl stop elecmove-api
        LAST_BACKUP=\$(ls -t /opt/elecmove/backend/backups/ | head -1)
        if [ -z \"\$LAST_BACKUP\" ]; then
          echo 'Aucun backup disponible'
          exit 1
        fi
        sudo cp /opt/elecmove/backend/backups/\$LAST_BACKUP /opt/elecmove/backend/elecmove-api.jar
        sudo systemctl start elecmove-api
        sleep 10
        if curl -f http://localhost:8080/actuator/health > /dev/null 2>&1; then
          echo 'Rollback réussi'
        else
          echo 'Erreur après rollback'
          exit 1
        fi
      "
  only:
    - main
  when: manual