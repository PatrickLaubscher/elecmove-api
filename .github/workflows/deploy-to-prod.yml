name: Deploy to prod

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    env:
      SPRING_PROFILES_ACTIVE: prod

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Build Production JAR
      run: ./gradlew clean build

    - name: deploy
      uses: appleboy/ssh-action@v1.2.0
      with:
        host: ${{secrets.SERVER_HOST}}
        username: ${{secrets.SERVER_USER}}
        key: ${{secrets.SERVER_SSH_KEY}}
        script: |
          APP_DIR=/opt/elecmove/backend
          REPO_URL=https://github.com/PatrickLaubscher/elecmove-api.git
          JAR_NAME=elecmove-api.jar
          
          # Crée le dossier si nécessaire
          mkdir -p $APP_DIR
          cd $APP_DIR
          
          # Sauvegarde l'ancien JAR
          if [ -f $JAR_NAME ]; then
            mv $JAR_NAME "${JAR_NAME}.backup_$(date +%Y%m%d%H%M%S)"
          fi
          
          # Clone ou pull du repo
          if [ -d .git ]; then
            git reset --hard
            git clean -fd
            git pull
          else
            git clone $REPO_URL .
          fi
          
          # Build du projet
          ./gradlew clean build -x test
          
          # Copie du JAR généré
          cp build/libs/*.jar $JAR_NAME
          
          # Redémarre le service Spring Boot
          sudo systemctl restart elecmove-backend
          sudo systemctl status elecmove-backend --no-pager