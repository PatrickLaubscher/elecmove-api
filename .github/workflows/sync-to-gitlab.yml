name: Sync Repository to GitLab

on:
  push:
    branches:
      - 'feature/**'
      - 'dev'
      - 'main'
      - 'dev'
  pull_request:
    branches:
      - 'feature/**'
      - 'dev'
      - 'main'
      - 'dev'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync to GitLab
        uses: keninkujovic/gitlab-sync@2.1.0
        with:
          gitlab_url: ${{ secrets.GITLAB_URL }}
          username: ${{ secrets.USERNAME }}
          gitlab_pat: ${{ secrets.GITLAB_PAT }}